name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-release.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check release version
        run: |
          node --input-type=module -e "import { assertReleaseTag } from './scripts/release-policy.mjs'; import fs from 'node:fs'; assertReleaseTag(process.env.GITHUB_REF, JSON.parse(fs.readFileSync('package.json')).version);"
      - name: Install desktop dependencies
        run: npm ci
      - name: Test desktop rules
        run: npm test
      - name: Check desktop types
        run: npm run typecheck
      - name: Install Inno Setup compiler
        run: |
          # The runner image usually ships Inno Setup 6; install the current package only when it is missing.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
      - name: Build ZIP and EXE installer
        run: npm run package:setup
      - name: Smoke test installation and data preservation
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $setup = Get-Item "release/Muse4AI-$version-Setup-win-x64.exe"
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $process = Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=`"$log`"" -PassThru -Wait
          if ($process.ExitCode -ne 0) { Get-Content $log -Tail 20; $t = Join-Path $env:TEMP ("diag-" + [guid]::NewGuid().ToString("N").Substring(0,6)); Copy-Item release/stage $t -Recurse; $rf = Join-Path $t "result.txt"; Push-Location $t; & powershell.exe -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File (Join-Path $t "install.ps1") -NoLaunch -CloseRunning -ResultFile $rf -Lang en 2>&1 | Out-Host; "install.ps1 exit: $LASTEXITCODE"; Pop-Location; if (Test-Path $rf) { "result: " + (Get-Content $rf -Raw) }; throw "EXE installer failed: $($process.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA 'Programs/Muse4AI'
          if (-not (Test-Path "$root/app-$version/Muse4AI.exe")) { throw 'Installed app missing' }
          if ((Get-Content "$root/current.txt").Trim() -ne $version) { throw 'Wrong installed version' }
          if (-not (Test-Path (Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs/Muse4AI.lnk'))) { throw 'Start Menu shortcut missing' }
          # Same-version reinstall exercises replacement and retains user data.
          $dataDir = Join-Path $env:APPDATA 'MuseStudio'
          New-Item $dataDir -ItemType Directory -Force | Out-Null
          $sentinel = Join-Path $dataDir 'ci-preservation.txt'
          Set-Content $sentinel 'preserve-ci-data'
          $process = Start-Process $setup.FullName -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'EXE reinstall failed' }
          if ((Get-Content $sentinel).Trim() -ne 'preserve-ci-data') { throw 'Reinstall changed data' }
          # The existing uninstall path must leave data intact.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File release/stage/uninstall.ps1
          if ($LASTEXITCODE -ne 0 -or (Test-Path "$root/app-$version/Muse4AI.exe")) { throw 'Uninstall failed' }
          if ((Get-Content $sentinel).Trim() -ne 'preserve-ci-data') { throw 'Uninstall changed data' }
      - name: Upload downloadable installers
        uses: actions/upload-artifact@v4
        with:
          name: Muse4AI-Windows-${{ github.run_number }}
          path: |
            desktop/release/*-Setup-win-x64.exe
            desktop/release/*.zip
            desktop/release/*.sha256.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Muse4AI-Windows-${{ github.run_number }}
          path: release
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "Muse4AI $RELEASE_TAG" --notes "Windows x64: EXE installer, fallback ZIP and SHA-256 checksums. Unsigned beta; preserves local data."